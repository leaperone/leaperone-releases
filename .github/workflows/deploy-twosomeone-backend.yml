name: Deploy 2SOMEone Backend
run-name: >-
  🚀 Deploy 2SOMEone Backend · ${{ github.event.client_payload.env || inputs.env || 'production' }} · ${{ github.event.client_payload.message || inputs.message || '' }} · @${{ github.event.client_payload.author || github.actor }} [src=${{ github.event.client_payload.source_sha || github.sha }}][env=${{ github.event.client_payload.env || inputs.env || 'production' }}]

on:
  repository_dispatch:
    types: [deploy-backend]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to deploy (only main or backend-v* tag accepted when env=production)'
        required: false
        default: 'main'
      env:
        description: 'Deploy environment'
        required: true
        type: choice
        options:
          - production
          - beta
        default: production

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ref: ${{ steps.set-ref.outputs.ref }}
      is_deployable: ${{ steps.set-ref.outputs.is_deployable }}
      is_tag: ${{ steps.set-ref.outputs.is_tag }}
      deploy_env: ${{ steps.set-ref.outputs.deploy_env }}
      source_sha: ${{ steps.source-coordinate.outputs.source_sha }}
      app_sha: ${{ steps.source-coordinate.outputs.app_sha }}
      components: ${{ steps.set-ref.outputs.components }}
      wait_for_web: ${{ steps.set-ref.outputs.wait_for_web }}
    steps:
      - name: Validate and set ref
        id: set-ref
        env:
          RAW_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.ref || github.event.client_payload.ref }}"
          ENV_INPUT="${{ github.event.inputs.env || github.event.client_payload.env }}"
          COMPONENTS="${{ github.event.client_payload.components || github.event.client_payload.build_targets }}"
          DEPLOY_ENV="${ENV_INPUT:-production}"
          SOURCE_SHA=""
          if [ -n "$RAW_SOURCE_SHA" ]; then
            [[ "$RAW_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "ERROR: repository_dispatch source_sha must be a full lowercase Git SHA" >&2
              exit 1
            }
            SOURCE_SHA="$RAW_SOURCE_SHA"
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          if [ -z "$COMPONENTS" ]; then
            COMPONENTS="backend"
          fi
          DEPLOY_BACKEND="false"
          WAIT_FOR_WEB="false"
          IFS=',' read -ra COMPONENT_LIST <<< "$COMPONENTS"
          for component in "${COMPONENT_LIST[@]}"; do
            component="${component//[[:space:]]/}"
            case "$component" in
              backend|all)
                DEPLOY_BACKEND="true"
                if [ "$component" = "all" ]; then
                  WAIT_FOR_WEB="true"
                fi
                ;;
              "")
                ;;
              *)
                echo "ERROR: deploy-backend only supports components=backend, got: $component" >&2
                exit 1
                ;;
            esac
          done
          if [ "$DEPLOY_BACKEND" != "true" ]; then
            echo "ERROR: no 2SOMEone backend component selected from: $COMPONENTS" >&2
            exit 1
          fi
          if [ "$WAIT_FOR_WEB" = "true" ] && [ -z "$SOURCE_SHA" ]; then
            echo "ERROR: components=all requires a full source_sha so backend can match the web migration run" >&2
            exit 1
          fi
          echo "components=backend" >> "$GITHUB_OUTPUT"
          echo "wait_for_web=$WAIT_FOR_WEB" >> "$GITHUB_OUTPUT"

          # workflow_dispatch + env=production: only main or backend-v* tag
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$DEPLOY_ENV" == "production" ]]; then
            if [[ "$REF" == "main" || "$REF" == "refs/heads/main" || "$REF" =~ ^backend-v[0-9]+\.[0-9]+\.[0-9]+ || "$REF" =~ ^refs/tags/backend-v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              IS_TAG=$([[ "$REF" =~ ^(refs/tags/)?backend-v ]] && echo true || echo false)
              echo "ref=$REF" >> "$GITHUB_OUTPUT"
              echo "is_deployable=true" >> "$GITHUB_OUTPUT"
              echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"
              echo "deploy_env=production" >> "$GITHUB_OUTPUT"
              echo "manual production: ref=$REF (is_tag=$IS_TAG)"
            else
              echo "ERROR: production workflow_dispatch only accepts ref=main or backend-v* tags, got: $REF" >&2
              exit 1
            fi
          elif [ -z "$REF" ] || [[ "$REF" == "main" ]] || [[ "$REF" == "refs/heads/main" ]]; then
            echo "ref=${REF:-main}" >> "$GITHUB_OUTPUT"
            echo "is_deployable=true" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
            echo "use main branch (ref empty or main)"
          elif [[ "$REF" =~ ^(backend-)?v[0-9]+\.[0-9]+\.[0-9]+ ]] || [[ "$REF" =~ ^refs/tags/ ]]; then
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            echo "is_deployable=true" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
            echo "detected tag: $REF"
          else
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            echo "is_deployable=false" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
            echo "non-deployable ref: $REF"
          fi

      - name: Checkout exact 2SOMEone source coordinate
        if: steps.set-ref.outputs.is_deployable == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: leaperone/2SOMEone
          ref: ${{ steps.set-ref.outputs.source_sha || steps.set-ref.outputs.ref }}

      - name: Resolve exact app SHA
        id: source-coordinate
        if: steps.set-ref.outputs.is_deployable == 'true'
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.set-ref.outputs.source_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          app_sha="$(git rev-parse --short=7 HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$app_sha" =~ ^[0-9a-f]{7}$ ]] || exit 1
          if [ -n "$EXPECTED_SOURCE_SHA" ] && [ "$source_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "ERROR: checked out source does not match repository_dispatch source_sha" >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "app_sha=$app_sha" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: prepare
    if: >-
      needs.prepare.outputs.is_deployable == 'true' &&
      !contains(github.event.client_payload.message || '', 'noci')
    # Backend images may be built on the PVE build runner (repository variable
    # TWOSOMEONE_BACKEND_BUILD_ON_PVE=true); otherwise they stay GitHub-hosted.
    runs-on: ${{ (vars.TWOSOMEONE_BACKEND_BUILD_ON_PVE == 'true') && fromJSON('["self-hosted","Linux","X64","pve-build"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    concurrency:
      group: deploy-twosomeone-backend-deployable-${{ needs.prepare.outputs.deploy_env }}
      cancel-in-progress: false
    outputs:
      image_digest: ${{ steps.runner-mode.outputs.pve == 'true' && steps.local-push.outputs.digest || steps.build-push.outputs.digest }}
      local_image_tag: ${{ steps.runner-mode.outputs.local_image_tag }}
      on_pve: ${{ steps.runner-mode.outputs.pve }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: leaperone/2SOMEone
          ref: ${{ needs.prepare.outputs.source_sha }}
          # Persistent PVE workspaces fetch only new history; a depth-1 fetch would
          # resend the whole tree over the narrow uplink on every build.
          fetch-depth: ${{ runner.environment == 'self-hosted' && '0' || '1' }}

      - name: Compute app SHA
        id: app-sha
        env:
          EXPECTED_APP_SHA: ${{ needs.prepare.outputs.app_sha }}
        run: |
          set -euo pipefail
          app_sha="$(git rev-parse --short=7 HEAD)"
          [ "$app_sha" = "$EXPECTED_APP_SHA" ] || {
            echo "ERROR: build checkout SHA does not match prepare job coordinate" >&2
            exit 1
          }
          echo "sha=$app_sha" >> "$GITHUB_OUTPUT"

      - name: Detect build runner
        id: runner-mode
        env:
          RUNNER_KIND: ${{ runner.environment }}
          APP_SHA: ${{ steps.app-sha.outputs.sha }}
          LOCAL_REGISTRY: ${{ secrets.PVE_LOCAL_REGISTRY }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_KIND" = "self-hosted" ]; then
            [[ "$LOCAL_REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || {
              echo "ERROR: PVE_LOCAL_REGISTRY must be host[:port] on the PVE build runner" >&2
              exit 1
            }
            echo "pve=true" >> "$GITHUB_OUTPUT"
            echo "local_image_tag=backend-${APP_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "pve=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Aliyun Docker Registry (Shanghai)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # The PVE runner reuses the Docker daemon's BuildKit so layer and cache-mount
          # state persists between builds. GitHub-hosted builds pin BuildKit because
          # 0.32 defaults attestations to OCI artifacts, which Aliyun ACR rejects.
          driver: ${{ steps.runner-mode.outputs.pve == 'true' && 'docker' || 'docker-container' }}
          driver-opts: ${{ steps.runner-mode.outputs.pve != 'true' && 'image=moby/buildkit:v0.31.2' || '' }}

      - name: Compute Docker tags
        id: docker-tags
        env:
          LOCAL_REGISTRY: ${{ steps.runner-mode.outputs.pve == 'true' && secrets.PVE_LOCAL_REGISTRY || '' }}
        run: |
          APP_SHA="${{ steps.app-sha.outputs.sha }}"
          IS_TAG="${{ needs.prepare.outputs.is_tag }}"
          REF="${{ needs.prepare.outputs.ref }}"

          TAGS=""
          TAGS+="registry.cn-shanghai.aliyuncs.com/leaperone/2someren:backend-main-latest"$'\n'
          TAGS+="registry.cn-shanghai.aliyuncs.com/leaperone/2someren:backend-${APP_SHA}"$'\n'
          if [ "$IS_TAG" == "true" ]; then
            TAG_NAME="${REF#refs/tags/}"
            TAGS+="registry.cn-shanghai.aliyuncs.com/leaperone/2someren:${TAG_NAME}"$'\n'
          fi
          if [ -n "$LOCAL_REGISTRY" ]; then
            # PVE builds also feed the local registry used by the PVE deployment.
            TAGS+="${LOCAL_REGISTRY}/leaperone/2someren:backend-main-latest"$'\n'
            TAGS+="${LOCAL_REGISTRY}/leaperone/2someren:backend-${APP_SHA}"$'\n'
          fi
          {
            echo "tags<<EOF"
            echo -n "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # PVE builds load the image into the shared Docker daemon and push only to the
      # local registry here, so the PVE deployment starts right away; push-aliyun
      # copies the same image to ACR in parallel.
      - name: Build and Push
        id: build-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/backend/docker/Dockerfile
          push: ${{ steps.runner-mode.outputs.pve != 'true' }}
          load: ${{ steps.runner-mode.outputs.pve == 'true' }}
          tags: ${{ steps.docker-tags.outputs.tags }}
          # PVE builds keep layers in the runner's BuildKit; the registry cache would
          # move every layer over the PVE uplink.
          cache-from: ${{ steps.runner-mode.outputs.pve != 'true' && 'type=registry,ref=registry.cn-shanghai.aliyuncs.com/leaperone/buildcache:backend-twosomeone' || '' }}
          cache-to: ${{ steps.runner-mode.outputs.pve != 'true' && 'type=registry,ref=registry.cn-shanghai.aliyuncs.com/leaperone/buildcache:backend-twosomeone,mode=max,ignore-error=true' || '' }}

      - name: Push to local registry (PVE)
        id: local-push
        if: steps.runner-mode.outputs.pve == 'true'
        env:
          LOCAL_REGISTRY: ${{ secrets.PVE_LOCAL_REGISTRY }}
          APP_SHA: ${{ steps.app-sha.outputs.sha }}
        run: |
          set -euo pipefail
          repo="${LOCAL_REGISTRY}/leaperone/2someren"
          docker push --quiet "${repo}:backend-${APP_SHA}"
          docker push --quiet "${repo}:backend-main-latest"
          digest="$(curl -fsSI \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "http://${LOCAL_REGISTRY}/v2/leaperone/2someren/manifests/backend-${APP_SHA}" \
            | awk 'tolower($1) == "docker-content-digest:" { print $2 }' | tr -d '\r')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "ERROR: could not read the local registry digest" >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Copies the exact PVE build to ACR (used by the cold-standby hook) without
  # holding up the PVE deployment.
  push-aliyun:
    needs: [prepare, build-and-push]
    if: needs.build-and-push.outputs.on_pve == 'true'
    runs-on: ${{ (needs.build-and-push.outputs.on_pve == 'true') && fromJSON('["self-hosted","Linux","X64","pve-build"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Login to Aliyun Docker Registry (Shanghai)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Push exact PVE build to Aliyun Shanghai
        id: push
        env:
          APP_SHA: ${{ needs.prepare.outputs.app_sha }}
          IS_TAG: ${{ needs.prepare.outputs.is_tag }}
          REF: ${{ needs.prepare.outputs.ref }}
          LOCAL_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
        run: |
          set -euo pipefail
          repo="registry.cn-shanghai.aliyuncs.com/leaperone/2someren"
          src="${repo}:backend-${APP_SHA}"
          # The build job loaded this tag into the Docker daemon shared by all PVE build runners.
          docker image inspect "$src" >/dev/null
          docker push --quiet "$src"
          docker tag "$src" "${repo}:backend-main-latest"
          docker push --quiet "${repo}:backend-main-latest"
          if [ "$IS_TAG" = "true" ]; then
            tag_name="${REF#refs/tags/}"
            [[ "$tag_name" =~ ^backend-v[0-9A-Za-z.+-]+$ ]] || {
              echo "ERROR: unexpected release tag name" >&2
              exit 1
            }
            docker tag "$src" "${repo}:${tag_name}"
            docker push --quiet "${repo}:${tag_name}"
          fi
          digest="sha256:$(docker buildx imagetools inspect --raw "$src" | sha256sum | cut -d' ' -f1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "ERROR: could not read the ACR digest" >&2
            exit 1
          }
          if [ "$digest" != "$LOCAL_DIGEST" ]; then
            echo "::warning::ACR digest $digest differs from the local registry digest $LOCAL_DIGEST"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Backend-only releases do not need a web migration. Combined releases wait for
  # the matching web workflow run to finish its dedicated migration job.
  await-migrate:
    needs: [prepare, build-and-push]
    if: needs.prepare.outputs.is_deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
    steps:
      - name: Wait for the matching web migration
        if: needs.prepare.outputs.wait_for_web == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          DEPLOY_ENV: ${{ needs.prepare.outputs.deploy_env }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 20 * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            matching="$(gh run list \
              -R "$GITHUB_REPOSITORY" \
              -w "Deploy 2SOMEone" \
              -e repository_dispatch \
              -L 100 \
              --json databaseId,status,conclusion,displayTitle \
              | jq \
                --arg src "[src=$SOURCE_SHA]" \
                --arg env_token "[env=$DEPLOY_ENV]" \
                '[.[] | select(.displayTitle | contains($src)) | select(.displayTitle | contains($env_token))] | sort_by(.databaseId) | last')"
            run_id="$(jq -r '.databaseId // empty' <<< "$matching")"
            status="$(jq -r '.status // empty' <<< "$matching")"
            conclusion="$(jq -r '.conclusion // empty' <<< "$matching")"
            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Matching web run $run_id completed successfully; continuing backend deploy."
                exit 0
              fi
              echo "ERROR: matching web run $run_id completed with conclusion=$conclusion" >&2
              exit 1
            fi
            echo "Waiting for matching web migration run: run_id=${run_id:-none} status=${status:-none}"
            sleep 20
          done
          echo "ERROR: timed out waiting for the matching web migration run" >&2
          exit 1

      - name: No-op for backend-only release
        if: needs.prepare.outputs.wait_for_web != 'true'
        run: echo "Backend-only release; no web migration run is expected."

  deploy-pve:
    needs: [prepare, build-and-push, await-migrate]
    if: needs.prepare.outputs.is_deployable == 'true'
    uses: ./.github/workflows/deploy-pve.yml
    with:
      project: twosomeone-backend
      env: ${{ needs.prepare.outputs.deploy_env }}
      internal: false
      local_image_tag: ${{ needs.build-and-push.outputs.local_image_tag }}
    secrets: inherit

  # Cold standby staging can be paused with TWOSOMEONE_COLD_STANDBY_STAGING=false.
  private-release-hook:
    needs: [prepare, build-and-push, await-migrate, deploy-pve, push-aliyun]
    if: >-
      always() &&
      vars.TWOSOMEONE_COLD_STANDBY_STAGING != 'false' &&
      needs.prepare.outputs.is_deployable == 'true' &&
      needs.prepare.outputs.deploy_env == 'production' &&
      needs.build-and-push.result == 'success' &&
      needs.await-migrate.result == 'success' &&
      needs.deploy-pve.result == 'success' &&
      (needs.push-aliyun.result == 'success' || needs.push-aliyun.result == 'skipped')
    uses: ./.github/workflows/private-release-hook.yml
    with:
      artifact: backend
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      image_ref: >-
        registry.cn-shanghai.aliyuncs.com/leaperone/2someren:backend-${{ needs.prepare.outputs.app_sha }}@${{ needs.push-aliyun.outputs.image_digest || needs.build-and-push.outputs.image_digest }}
      release_run_id: ${{ github.run_id }}
    secrets:
      dispatch_repository: ${{ secrets.PRIVATE_RELEASE_REPOSITORY }}
      dispatch_workflow: ${{ secrets.PRIVATE_RELEASE_WORKFLOW }}
      dispatch_token: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
