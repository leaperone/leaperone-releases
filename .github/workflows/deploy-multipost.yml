name: Deploy MultiPost
run-name: >-
  🚀 Deploy MultiPost · ${{ github.event.client_payload.env || inputs.env || 'production' }} · ${{ github.event.client_payload.message || inputs.message || '' }} · @${{ github.event.client_payload.author || github.actor }} [src=${{ github.event.client_payload.source_sha || github.sha }}][env=${{ github.event.client_payload.env || inputs.env || 'production' }}]

on:
  repository_dispatch:
    types: [deploy-multipost]

jobs:
  resolve-context:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      is_deployable: ${{ steps.resolve.outputs.is_deployable }}
      deploy_env: ${{ steps.resolve.outputs.deploy_env }}
      deploy_de: ${{ steps.resolve.outputs.deploy_de }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      components: ${{ steps.resolve.outputs.components }}
      build_web: ${{ steps.resolve.outputs.build_web }}
      build_backend: ${{ steps.resolve.outputs.build_backend }}
      migration_mode: ${{ steps.resolve.outputs.migration_mode }}
    steps:
      - name: Resolve deploy context
        id: resolve
        env:
          RAW_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          REF="${{ github.event.client_payload.ref }}"
          ENV_INPUT="${{ github.event.client_payload.env }}"
          COMPONENTS="${{ github.event.client_payload.components || github.event.client_payload.build_targets }}"

          [[ "$RAW_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: repository_dispatch source_sha must be a full lowercase Git SHA" >&2
            exit 1
          }

          DEPLOY_ENV="production"
          IS_DEPLOYABLE="true"
          DEPLOY_DE="true"

          if [ -z "$COMPONENTS" ]; then
            if [[ "$REF" =~ ^(refs/tags/)?worker-v ]]; then
              echo "ERROR: retired worker tags require an explicit web or backend component" >&2
              exit 1
            fi
            if [[ "$REF" =~ ^(refs/tags/)?web-v ]]; then
              COMPONENTS="web"
            else
              COMPONENTS="web,backend"
            fi
          fi

          BUILD_WEB="false"
          BUILD_BACKEND="false"

          IFS=',' read -ra COMPONENT_LIST <<< "$COMPONENTS"
          for component in "${COMPONENT_LIST[@]}"; do
            component="${component//[[:space:]]/}"
            case "$component" in
              web)
                BUILD_WEB="true"
                ;;
              backend)
                BUILD_BACKEND="true"
                ;;
              all)
                BUILD_WEB="true"
                BUILD_BACKEND="true"
                ;;
              "")
                ;;
              *)
                echo "ERROR: unknown MultiPost component: $component" >&2
                exit 1
                ;;
            esac
          done
          if [ "$BUILD_WEB" = "false" ] && [ "$BUILD_BACKEND" = "false" ]; then
            echo "ERROR: no MultiPost components selected from: $COMPONENTS" >&2
            exit 1
          fi

          if [ "$BUILD_WEB" = "true" ] && [ "$BUILD_BACKEND" = "false" ]; then
            MIGRATION_MODE="verify-only"
          else
            MIGRATION_MODE="apply"
          fi

          if [ "$ENV_INPUT" != "" ] && [ "$ENV_INPUT" != "$DEPLOY_ENV" ]; then
            echo "ERROR: deploy-multipost only supports env=production, got: $ENV_INPUT" >&2
            exit 1
          fi

          if [ -z "$REF" ]; then
            RESOLVED_REF="main"
            echo "使用默认分支: main (ref 为空)"
          elif [[ "$REF" == "main" ]] || [[ "$REF" == "refs/heads/main" ]]; then
            RESOLVED_REF="$REF"
            echo "使用 main 分支: $REF"
          elif [[ "$REF" =~ ^([0-9]+)/merge ]] || [[ "$REF" == *"/merge"* ]]; then
            echo "ERROR: deploy-multipost is deploy-only. PR merge refs are handled by verify-pr-multipost. Got ref: $REF" >&2
            exit 1
          elif [[ "$REF" =~ ^(web-|worker-)?v[0-9]+\.[0-9]+\.[0-9]+ ]] || [[ "$REF" =~ ^refs/tags/ ]]; then
            RESOLVED_REF="$REF"
            echo "检测到 tag: ${REF}，将执行部署"
          else
            echo "ERROR: deploy-multipost only accepts deployable refs (main or release tags). Got ref: $REF" >&2
            exit 1
          fi

          echo "ref=$RESOLVED_REF" >> "$GITHUB_OUTPUT"
          echo "source_sha=$RAW_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_number=" >> "$GITHUB_OUTPUT"
          echo "is_deployable=$IS_DEPLOYABLE" >> "$GITHUB_OUTPUT"
          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "deploy_de=$DEPLOY_DE" >> "$GITHUB_OUTPUT"
          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"
          echo "build_web=$BUILD_WEB" >> "$GITHUB_OUTPUT"
          echo "build_backend=$BUILD_BACKEND" >> "$GITHUB_OUTPUT"
          echo "migration_mode=$MIGRATION_MODE" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: resolve-context
    if: >-
      needs.resolve-context.outputs.is_deployable == 'true' &&
      !contains(github.event.client_payload.message || '', 'noci')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-multipost-production
      cancel-in-progress: false
    env:
      TARGET_REGISTRY_HOST: ${{ secrets.DE_REGISTRY_HOST || 'registry.cn-hongkong.aliyuncs.com' }}
    outputs:
      app_sha: ${{ steps.app-sha.outputs.sha }}
      source_sha: ${{ steps.app-sha.outputs.source_sha }}
      sourcemap_bundle_key: ${{ steps.stage-sourcemaps.outputs.bundle_key }}
      component_digests: ${{ steps.push.outputs.component_digests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: leaperone/MultiPost
          ref: ${{ needs.resolve-context.outputs.source_sha }}

      - name: Setup docker-compose
        uses: KengoTODA/actions-setup-docker-compose@b09fb2b902df45b91982bc46858188f2a714ee5f # v1
        with:
          version: '2.14.2'

      - name: Set up Docker Buildx with pinned BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.31.2
            default-load=true

      - name: Compute app SHA
        id: app-sha
        run: |
          set -euo pipefail
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate telemetry inputs
        if: needs.resolve-context.outputs.build_web == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ vars.MULTIPOST_SENTRY_DSN }}
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_MULTIPOST_PROJECT_TOKEN }}
        run: |
          test -n "$SENTRY_AUTH_TOKEN" || { echo "SENTRY_AUTH_TOKEN required"; exit 1; }
          test -n "$SENTRY_DSN" || { echo "MULTIPOST_SENTRY_DSN required"; exit 1; }
          if ! [[ "$SENTRY_DSN" =~ ^https://[A-Za-z0-9._-]+@s\.multipost\.app/[0-9]+$ ]]; then
            echo "MULTIPOST_SENTRY_DSN must use the MultiPost product ingest domain" >&2
            exit 1
          fi
          test -n "$POSTHOG_PROJECT_TOKEN" || { echo "POSTHOG_MULTIPOST_PROJECT_TOKEN required"; exit 1; }

      - name: Build Docker images
        env:
          # Build-time Sentry ID injection is offline. Upload credentials must
          # not enter image build arguments.
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_MULTIPOST_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: https://t.multipost.app
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.MULTIPOST_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ needs.resolve-context.outputs.deploy_env }}
          SENTRY_URL: ${{ secrets.SENTRY_INTERNAL_URL }}
          SENTRY_ORG: leaperone
          SENTRY_PROJECT: multipost-web
          SENTRY_RELEASE: multipost-web@${{ steps.app-sha.outputs.sha }}
          # Sentry IDs are injected into the exact build, but uploads are
          # owned by the PVE job below. Keep this empty to prevent build-time upload.
          SENTRY_AUTH_TOKEN: ""
        run: |
          BUILD_SERVICES=""
          if [ "${{ needs.resolve-context.outputs.build_web }}" = "true" ]; then
            BUILD_SERVICES="$BUILD_SERVICES multipost"
          fi
          if [ "${{ needs.resolve-context.outputs.build_backend }}" = "true" ]; then
            BUILD_SERVICES="$BUILD_SERVICES multipost-backend"
          fi
          echo "Building services:$BUILD_SERVICES"
          docker compose -f ./docker/docker-compose-build.yml build $BUILD_SERVICES

      - name: Extract sourcemaps from builder
        if: needs.resolve-context.outputs.build_web == 'true'
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.MULTIPOST_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ needs.resolve-context.outputs.deploy_env }}
          SENTRY_URL: ${{ secrets.SENTRY_INTERNAL_URL }}
          SENTRY_ORG: leaperone
          SENTRY_PROJECT: multipost-web
          SENTRY_RELEASE: multipost-web@${{ steps.app-sha.outputs.sha }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_MULTIPOST_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: https://t.multipost.app
        run: |
          docker buildx build \
            -f ./docker/Dockerfile \
            --target sourcemaps \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="$NEXT_PUBLIC_SENTRY_DSN" \
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT="$NEXT_PUBLIC_SENTRY_ENVIRONMENT" \
            --build-arg SENTRY_URL="$SENTRY_URL" \
            --build-arg SENTRY_ORG="$SENTRY_ORG" \
            --build-arg SENTRY_PROJECT="$SENTRY_PROJECT" \
            --build-arg SENTRY_RELEASE="$SENTRY_RELEASE" \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY="$NEXT_PUBLIC_POSTHOG_KEY" \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST="$NEXT_PUBLIC_POSTHOG_HOST" \
            --progress=plain \
            --output type=local,dest=$RUNNER_TEMP/sourcemaps \
            .

      - name: Pack sourcemaps
        if: needs.resolve-context.outputs.build_web == 'true'
        run: tar -czf "$RUNNER_TEMP/sourcemaps.tar" -C "$RUNNER_TEMP/sourcemaps" .

      - name: Checkout source map transport
        if: needs.resolve-context.outputs.build_web == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .release-automation
          persist-credentials: false

      - name: Stage exact-build source maps on the deployment node
        id: stage-sourcemaps
        if: needs.resolve-context.outputs.build_web == 'true'
        env:
          SOURCEMAP_SPOOL_HOST: ${{ secrets.DE_APP_HOST }}
          SOURCEMAP_SPOOL_PORT: ${{ vars.DE_APP_PORT || '22' }}
          SOURCEMAP_SPOOL_USERNAME: ${{ secrets.DE_APP_USERNAME }}
          SOURCEMAP_SPOOL_SSH_KEY: ${{ secrets.DE_APP_SSH_KEY }}
          SOURCEMAP_SPOOL_ROOT: ${{ secrets.SOURCEMAP_SPOOL_ROOT }}
          BUNDLE_KEY: multipost/${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.app-sha.outputs.sha }}.tar
        run: |
          .release-automation/scripts/stage-sourcemap-bundle.sh "$RUNNER_TEMP/sourcemaps.tar" "$BUNDLE_KEY"
          echo "bundle_key=$BUNDLE_KEY" >> "$GITHUB_OUTPUT"

      - name: Validate overseas registry configuration
        env:
          DE_REGISTRY_HOST: ${{ secrets.DE_REGISTRY_HOST }}
          DE_REGISTRY_USERNAME: ${{ secrets.DE_REGISTRY_USERNAME }}
          DE_REGISTRY_PASSWORD: ${{ secrets.DE_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$DE_REGISTRY_HOST" ] || exit 0
          if ! [[ "$DE_REGISTRY_HOST" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+(:[0-9]{1,5})?$ ]] \
            || [[ "$DE_REGISTRY_HOST" =~ ^[0-9.]+$ ]]; then
            echo "ERROR: DE_REGISTRY_HOST must be a lowercase registry host with optional port and no scheme or path" >&2
            exit 1
          fi
          case "registry.cn-hongkong.aliyuncs.com" in
            *"$DE_REGISTRY_HOST"*) echo "ERROR: leave DE_REGISTRY_HOST unset to use the default Aliyun registry" >&2; exit 1 ;;
          esac
          test -n "$DE_REGISTRY_USERNAME" || { echo "ERROR: DE_REGISTRY_USERNAME is required with DE_REGISTRY_HOST" >&2; exit 1; }
          test -n "$DE_REGISTRY_PASSWORD" || { echo "ERROR: DE_REGISTRY_PASSWORD is required with DE_REGISTRY_HOST" >&2; exit 1; }

      - name: Login to overseas Docker registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.TARGET_REGISTRY_HOST }}
          username: ${{ secrets.DE_REGISTRY_HOST && secrets.DE_REGISTRY_USERNAME || secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.DE_REGISTRY_HOST && secrets.DE_REGISTRY_PASSWORD || secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Push Docker images to overseas registry
        id: push
        run: |
          set -euo pipefail
          LOCAL_REPOSITORY="registry.cn-hongkong.aliyuncs.com/leaperone/multipost"
          TARGET_REPOSITORY="${TARGET_REGISTRY_HOST}/leaperone/multipost"
          COMPONENT_DIGESTS=""

          # The latest tags stay for discovery; deployment pins the pushed digest.
          push_image() {
            local component="$1"
            local tag="$2"
            local push_output
            local digest
            docker tag "$LOCAL_REPOSITORY:$tag" "$TARGET_REPOSITORY:$tag"
            push_output="$(docker push "$TARGET_REPOSITORY:$tag" 2>&1)"
            printf '%s\n' "$push_output"
            digest="$(printf '%s\n' "$push_output" | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' | tail -n 1)"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: registry push for $component did not return a valid manifest digest" >&2
              exit 1
            fi
            COMPONENT_DIGESTS="${COMPONENT_DIGESTS:+$COMPONENT_DIGESTS,}${component}=${digest}"
          }

          if [ "${{ needs.resolve-context.outputs.build_web }}" = "true" ]; then
            echo "Pushing web image..."
            push_image web "latest"
          fi

          if [ "${{ needs.resolve-context.outputs.build_backend }}" = "true" ]; then
            echo "Pushing backend image..."
            push_image backend "backend-latest"
          fi


          echo "component_digests=$COMPONENT_DIGESTS" >> "$GITHUB_OUTPUT"

  upload-sourcemaps:
    needs: [resolve-context, build-and-push]
    if: needs.resolve-context.outputs.is_deployable == 'true' && needs.resolve-context.outputs.build_web == 'true'
    uses: ./.github/workflows/upload-telemetry-sourcemaps.yml
    with:
      bundle_key: ${{ needs.build-and-push.outputs.sourcemap_bundle_key }}
      sentry_project: multipost-web
      sentry_release: multipost-web@${{ needs.build-and-push.outputs.app_sha }}
    secrets:
      spool_host: ${{ secrets.DE_APP_HOST }}
      spool_username: ${{ secrets.DE_APP_USERNAME }}
      spool_ssh_key: ${{ secrets.DE_APP_SSH_KEY }}
      spool_root: ${{ secrets.SOURCEMAP_SPOOL_ROOT }}
      sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      sentry_internal_url: ${{ secrets.SENTRY_INTERNAL_URL }}

  migrate-production:
    needs: [resolve-context, build-and-push]
    if: needs.resolve-context.outputs.is_deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-multipost-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: leaperone/MultiPost
          ref: ${{ needs.build-and-push.outputs.source_sha }}
          fetch-depth: 0

      - name: Install Atlas Community
        run: |
          curl -fsSL https://release.ariga.io/atlas/atlas-community-linux-amd64-v1.2.2 -o /tmp/atlas
          printf '%s  %s\n' 'a38e34e886cd0b9d2d625fe0046fed107785b1562bd2d07dbd96fadfc57dec62' /tmp/atlas | sha256sum -c -
          chmod +x /tmp/atlas
          sudo mv /tmp/atlas /usr/local/bin/atlas

      - name: Resolve migration mode
        id: migration
        env:
          REQUESTED_MODE: ${{ needs.resolve-context.outputs.migration_mode }}
        run: |
          set -euo pipefail
          mode="$REQUESTED_MODE"
          if [ "$mode" = "verify-only" ]; then
            baseline="$(git describe --tags --match 'web-v*' --abbrev=0 HEAD^ 2>/dev/null || true)"
            if [ -z "$baseline" ]; then
              echo "ERROR: cannot resolve the prior Web release tag for migration safety" >&2
              exit 1
            fi
            if ! git diff --quiet "$baseline" HEAD -- db; then
              echo "Database files changed since $baseline; promoting this Web-only release to migration apply."
              mode=apply
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Open DE Postgres SSH tunnel
        env:
          DE_APP_HOST: ${{ secrets.DE_APP_HOST }}
          DE_APP_USERNAME: ${{ secrets.DE_APP_USERNAME }}
          DE_APP_SSH_KEY: ${{ secrets.DE_APP_SSH_KEY }}
          DE_APP_PORT: ${{ vars.DE_APP_PORT || '22' }}
        run: |
          test -n "$DE_APP_HOST" || { echo "DE_APP_HOST required"; exit 1; }
          test -n "$DE_APP_USERNAME" || { echo "DE_APP_USERNAME required"; exit 1; }
          test -n "$DE_APP_SSH_KEY" || { echo "DE_APP_SSH_KEY required"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DE_APP_SSH_KEY" > ~/.ssh/de_app_key
          chmod 600 ~/.ssh/de_app_key
          ssh-keyscan -p "${DE_APP_PORT:-22}" "$DE_APP_HOST" >> ~/.ssh/known_hosts
          ssh -fN \
            -i ~/.ssh/de_app_key \
            -p "${DE_APP_PORT:-22}" \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -L 127.0.0.1:15432:127.0.0.1:5432 \
            "${DE_APP_USERNAME}@${DE_APP_HOST}"

      - name: Checkout web-only migration guard
        if: steps.migration.outputs.mode == 'verify-only'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .release-automation
          persist-credentials: false

      - name: Verify database unchanged (web-only)
        if: steps.migration.outputs.mode == 'verify-only'
        env:
          MULTIPOST_DATABASE_URL: ${{ secrets.MULTIPOST_DATABASE_URL }}
        run: |
          set -euo pipefail
          python3 .release-automation/scripts/verify-multipost-no-migrations.py

      - name: Run database migrations (Atlas)
        if: steps.migration.outputs.mode == 'apply'
        env:
          MULTIPOST_DATABASE_URL: ${{ secrets.MULTIPOST_DATABASE_URL }}
        run: |
          # Strip Prisma-specific query params (schema=, pgbouncer=, ...) that
          # libpq/Atlas rejects; the same URL shape also serves the app runtime.
          MULTIPOST_DATABASE_URL="$(printf '%s' "$MULTIPOST_DATABASE_URL" | sed -E '
            s/([?&])(schema|pgbouncer|connection_limit|pool_timeout|connect_timeout|socket_timeout|statement_cache_size|TimeZone)=[^&]*/\1/g
            s/&&+/\&/g
            s/\?&/?/
            s/[?&]+$//
          ')"
          export MULTIPOST_DATABASE_URL
          atlas migrate apply --env production --config file://db/atlas/atlas.hcl

  deploy-de:
    needs: [resolve-context, build-and-push, migrate-production]
    if: needs.resolve-context.outputs.is_deployable == 'true' && needs.resolve-context.outputs.deploy_de == 'true'
    concurrency:
      group: deploy-multipost-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-de.yml
    with:
      project: multipost
      env: production
      components: ${{ needs.resolve-context.outputs.components }}
      component_digests: ${{ needs.build-and-push.outputs.component_digests }}
    secrets: inherit
