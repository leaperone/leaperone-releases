name: Deploy SaraClick
run-name: >-
  🚀 Deploy SaraClick · ${{ github.event.client_payload.env || 'production' }} · ${{ github.event.client_payload.message || '' }} · @${{ github.event.client_payload.author || github.actor }} [src=${{ github.event.client_payload.source_sha || github.sha }}][env=${{ github.event.client_payload.env || 'production' }}]

on:
  repository_dispatch:
    types: [deploy-saraclick]

permissions:
  contents: read

concurrency:
  group: deploy-saraclick-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ !contains(github.event.client_payload.message || '', 'noci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      pr_number: ${{ steps.set-ref.outputs.pr_number }}
      is_deployable: ${{ steps.set-ref.outputs.is_deployable }}
      components: ${{ steps.set-ref.outputs.components }}

    steps:
      - name: Validate and set ref
        id: set-ref
        env:
          REF: ${{ github.event.client_payload.ref }}
          COMPONENTS: ${{ github.event.client_payload.components || github.event.client_payload.build_targets }}
          DEPLOY_ENV: ${{ github.event.client_payload.env || 'production' }}
        run: |
          set -euo pipefail
          [ "$DEPLOY_ENV" = production ] || { echo 'ERROR: production only' >&2; exit 1; }
          if [ -z "$COMPONENTS" ]; then
            COMPONENTS="web,backend"
          fi
          DEPLOY_WEB="false"
          DEPLOY_BACKEND="false"
          IFS=',' read -ra COMPONENT_LIST <<< "$COMPONENTS"
          for component in "${COMPONENT_LIST[@]}"; do
            component="${component//[[:space:]]/}"
            case "$component" in
              web)
                DEPLOY_WEB="true"
                ;;
              backend)
                DEPLOY_BACKEND="true"
                ;;
              all)
                DEPLOY_WEB="true"
                DEPLOY_BACKEND="true"
                ;;
              "")
                ;;
              *)
                echo "ERROR: unknown SaraClick component: $component" >&2
                exit 1
                ;;
            esac
          done
          if [ "$DEPLOY_WEB" != "true" ] || [ "$DEPLOY_BACKEND" != "true" ]; then
            echo "ERROR: deploy-saraclick currently deploys web+backend together; use components=web,backend or all" >&2
            exit 1
          fi
          echo "components=web,backend" >> "$GITHUB_OUTPUT"

          if [ -z "$REF" ]; then
            {
              echo "ref=main"
              echo "pr_number="
              echo "is_deployable=true"
            } >> "$GITHUB_OUTPUT"
            echo "使用默认分支: main (ref 为空)"
          elif [[ "$REF" == "main" ]] || [[ "$REF" == "refs/heads/main" ]]; then
            {
              echo "ref=$REF"
              echo "pr_number="
              echo "is_deployable=true"
            } >> "$GITHUB_OUTPUT"
            echo "使用 main 分支: $REF"
          elif [[ "$REF" =~ ^([0-9]+)/merge ]] || [[ "$REF" == *"/merge"* ]]; then
            echo "ERROR: deploy-saraclick is deploy-only and does not accept PR merge refs. Got ref: $REF" >&2
            exit 1
          elif [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || [[ "$REF" =~ ^refs/tags/ ]]; then
            # Tag 格式，标记为需要部署
            {
              echo "ref=$REF"
              echo "pr_number="
              echo "is_deployable=true"
            } >> "$GITHUB_OUTPUT"
            echo "检测到 tag: $REF，将执行部署"
          else
            echo "ERROR: deploy-saraclick only accepts deployable refs (main or release tags). Got ref: $REF" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: leaperone/SaraClick
          ref: ${{ steps.set-ref.outputs.ref }}
          persist-credentials: false

      - name: Setup docker-compose
        uses: KengoTODA/actions-setup-docker-compose@b09fb2b902df45b91982bc46858188f2a714ee5f # v1
        with:
          version: '2.14.2'

      - name: Set up Docker Buildx with pinned BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.31.2
            default-load=true

      - name: Build Docker images
        run: docker compose -f ./docker/docker-compose-build.yml build

      - name: Login to production registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.DE_REGISTRY_HOST }}
          username: ${{ secrets.DE_REGISTRY_USERNAME }}
          password: ${{ secrets.DE_REGISTRY_PASSWORD }}

      - name: Push exact source image pair
        id: images
        env:
          TARGET_REGISTRY: ${{ secrets.DE_REGISTRY_HOST }}
          EXPECTED_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$source_sha" ]; then
            echo 'ERROR: source_sha does not match the checked out source' >&2
            exit 1
          fi
          [[ "$TARGET_REGISTRY" =~ ^[a-z0-9.-]+(:[0-9]+)?$ ]] || exit 2
          for component in web backend; do
            local_tag=latest
            [ "$component" != backend ] || local_tag=backend-latest
            image="$TARGET_REGISTRY/leaperone/saraclick:$component-$source_sha"
            docker tag "registry.cn-hongkong.aliyuncs.com/leaperone/saraclick:$local_tag" "$image"
            output=$(docker push "$image" 2>&1)
            printf '%s\n' "$output"
            digest=$(printf '%s\n' "$output" | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' | tail -n 1)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            echo "$component=$TARGET_REGISTRY/leaperone/saraclick@$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout deployment assets
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .release-automation
          persist-credentials: false

      - name: Set up migration runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Migrate and deploy production image pair
        env:
          DEPLOY_HOST: ${{ secrets.DE_APP_HOST }}
          DEPLOY_USER: ${{ secrets.DE_APP_USERNAME }}
          DEPLOY_PORT: ${{ vars.DE_APP_PORT || '22' }}
          DEPLOY_KEY: ${{ secrets.DE_APP_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DE_APP_SSH_HOST_KEY }}
          DEPLOY_ROOT: ${{ secrets.SARACLICK_DEPLOY_ROOT }}
          SARACLICK_DATABASE_URL: ${{ secrets.SARACLICK_DATABASE_URL }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
        run: |
          set -euo pipefail
          umask 077
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_KEY DEPLOY_HOST_KEY DEPLOY_ROOT SARACLICK_DATABASE_URL; do
            [ -n "${!name}" ] || { echo "ERROR: $name is required" >&2; exit 1; }
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || exit 2
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]] || exit 2
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || exit 2
          [[ "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9_/-]+$ && "$DEPLOY_ROOT" != *..* ]] || exit 2
          python3 - <<'PYTHON'
          import os
          import sys
          from urllib.parse import parse_qs, unquote, urlsplit
          try:
              url = urlsplit(os.environ['SARACLICK_DATABASE_URL'])
              if not (url.scheme in ('postgres', 'postgresql')
                      and url.hostname == '127.0.0.1' and url.port == 15432
                      and unquote(url.username or '') == 'saraclick_app'
                      and url.path == '/saraclick_db' and url.password
                      and parse_qs(url.query).get('sslmode') == ['disable']
                      and not url.fragment):
                  raise ValueError()
          except (KeyError, ValueError):
              sys.exit('ERROR: migration URL must use the SaraClick role through the local SSH tunnel with sslmode=disable')
          PYTHON
          ssh_dir=$(mktemp -d)
          cleanup() {
            if [ -S "$ssh_dir/control" ]; then
              ssh -S "$ssh_dir/control" -O exit "$DEPLOY_USER@$DEPLOY_HOST" >/dev/null 2>&1 || true
            fi
            rm -rf "$ssh_dir"
          }
          trap cleanup EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$ssh_dir/known_hosts"
          known_host="$DEPLOY_HOST"
          [ "$DEPLOY_PORT" = 22 ] || known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"
          ssh-keygen -F "$known_host" -f "$ssh_dir/known_hosts" >/dev/null || {
            echo 'ERROR: DE_APP_SSH_HOST_KEY must contain a matching known_hosts entry' >&2; exit 1;
          }
          transport=(-i "$ssh_dir/key" -o BatchMode=yes -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          ssh "${transport[@]}" -p "$DEPLOY_PORT" -M -S "$ssh_dir/control" -fN \
            -o ExitOnForwardFailure=yes -L 127.0.0.1:15432:127.0.0.1:5432 "$DEPLOY_USER@$DEPLOY_HOST"
          # Refuse migrations until the operator has completed the first cutover.
          ssh "${transport[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -f '$DEPLOY_ROOT/.cutover-complete'"
          npm install -g prisma@6.19.0
          sh prisma/migrate_deploy.sh
          release_dir="$DEPLOY_ROOT/.release-tools/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${transport[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release_dir'"
          scp "${transport[@]}" -P "$DEPLOY_PORT" .release-automation/compose/saraclick/* \
            "$DEPLOY_USER@$DEPLOY_HOST:$release_dir/"
          ssh "${transport[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$release_dir/deploy.sh' '$DEPLOY_ROOT' '$WEB_IMAGE' '$BACKEND_IMAGE'"
