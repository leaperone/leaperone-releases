name: undersky-core-${DEPLOY_ENV:-production}

# Runtime secrets stay in host-managed .env.* files. Image references are
# immutable digests supplied by deploy-core.sh.
services:
  www:
    image: ${WWW_IMAGE_REF:?WWW_IMAGE_REF must be an immutable registry digest}
    container_name: undersky-www-${DEPLOY_ENV:-production}
    env_file: [.env.www]
    ports: ["127.0.0.1:${WWW_PORT:?WWW_PORT must be supplied by the host}:3000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
  dashboard:
    image: ${DASHBOARD_IMAGE_REF:?DASHBOARD_IMAGE_REF must be an immutable registry digest}
    container_name: undersky-dashboard-${DEPLOY_ENV:-production}
    env_file: [.env.dashboard]
    environment:
      LEAPERONE_LEGACY_DATABASE: "true"
    ports: ["127.0.0.1:${DASHBOARD_PORT:?DASHBOARD_PORT must be supplied by the host}:3000"]
    restart: unless-stopped
    networks: [leaperone-prod]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/ready"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
  api:
    image: ${API_IMAGE_REF:?API_IMAGE_REF must be an immutable registry digest}
    container_name: undersky-api-${DEPLOY_ENV:-production}
    env_file: [.env.api]
    environment:
      PORT: 9100
      RATE_LIMIT_STORE: postgres
      ENABLE_IMAGE_WORKER: "false"
      ENABLE_VIDEO_WORKER: "false"
      RUN_MIGRATIONS: "false"
    ports: ["127.0.0.1:${API_PORT:?API_PORT must be supplied by the host}:9100"]
    restart: unless-stopped
    networks: [leaperone-prod]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  leaperone-prod:
    external: true
